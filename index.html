<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#101010">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Beatmemo - Menú Digital</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link href="https://fonts.googleapis.com/css2?family=Antic+Didone&family=Josefin+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    
    <link rel="stylesheet" href="./qr-webmenu.css">
    <link rel="shortcut icon" type="image/jpg" href="./img/btm-favicon.png"/>
</head>
<body>

    <div id="view-home" class="view">
        <header class="home-header">
            <img class="img-banner" src="./img/recurso1.png" alt="Beatmemo logo">
        </header>
        
        <main class="main">
            <section class="main-items">
                <div class="main-items_btns">
                    <button onclick="window.location.href = 'index.html?tipo=fullmenu1'">Carta Principal</button>
                    <button onclick="window.location.href = 'index.html?tipo=ejecutivo1'">Menú Ejecutivo</button>
                    <button onclick="window.location.href = 'index.html?tipo=hh1'">Happy Hour</button>
                    <button onclick="window.location.href = 'index.html?tipo=whisky1'">Whisky Collection</button>
                    
                    <button class="btn-shows" onclick="window.location.href = 'http://beatmemo.com.ar/page/noticias'">Agenda de Shows
                    </button>
                    
                    <button class="btn-rooftop" onclick="window.location.href = 'https://www.instagram.com/rooftopbeatmemo/'">
                        <!-- <i class="ri-glasses-line"></i> -->
                        ROOFTOP
                    </button>
                    <button class="btn-google" onclick="window.location.href = 'https://g.page/r/CZ8oHnT2ZcQjEAE/review'">
                         Contanos tu experiencia en GOOGLE
                    </button>
                </div>
            </section>

            <section class="main-redes">
                <div class="main-redes_icon">
                    <a href="https://wa.me/+5493412023737"><i class="ri-whatsapp-fill"></i></a>
                    <a href="https://www.instagram.com/beatmemo_rosario"><i class="ri-instagram-fill"></i></a>
                    <a href="https://www.facebook.com/beatmemopub/"><i class="ri-facebook-circle-fill"></i></a>
                </div>
            </section>
        </main>
    </div>

    <div id="view-visor" class="view" style="display: none;">
        
        <header class="visor-header">
            <h3 id="pdf_name">CARGANDO...</h3>
            <button class="btn-close-top" onclick="window.location.href='index.html'">
                <i class="ri-close-circle-line"></i>
            </button>
        </header>

        <div id="loader-container">
            <div class="spinner"></div>
            <p class="loader-text">Preparando la carta...</p>
        </div>

        <main id="pdf-viewer-container">
            <canvas id="the-canvas"></canvas>
        </main>

        <nav class="nav-bottom">
            <div class="nav-container">
                
                <button class="nav-btn-action" onclick="window.location.href='index.html'" aria-label="Volver al Inicio">
                    <i class="ri-home-4-line"></i>
                </button>

                <div class="nav-pagination-group">
                    <button class="nav-btn-control" id="prev-page" aria-label="Página Anterior">
                        <i class="ri-arrow-left-s-line"></i>
                    </button>
                    
                    <span class="page-indicator">
                        <span id="page_num">1</span> / <span id="page_count">-</span>
                    </span>

                    <button class="nav-btn-control" id="next-page" aria-label="Página Siguiente">
                        <i class="ri-arrow-right-s-line"></i>
                    </button>
                </div>

                <div class="dropdown-container">
                    <input type="checkbox" id="openDropdown" hidden>
                    
                    <ul class="dropdown-menu">
                        <li><a href="index.html?tipo=fullmenu1">Principal</a></li>
                        <li><a href="index.html?tipo=ejecutivo1">Ejecutivo</a></li>
                        <li><a href="index.html?tipo=hh1">Happy Hour</a></li>
                        <li><a href="index.html?tipo=whisky1">Whiskies</a></li>
                    </ul>
                    
                    <label for="openDropdown" class="nav-btn-action dropdown-trigger" aria-label="Abrir Menú">
                        <i class="ri-menu-add-line"></i>
                    </label>
                </div>

            </div>
        </nav>
    </div>

    <script src="./qr-webmenu.js"></script>
</body>
</html>
